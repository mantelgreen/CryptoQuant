[project]
name = "cryptoquant"
version = "0.1.0"
description = "数字币量化交易策略研究平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "arq>=0.25",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "PyJWT>=2.9",
    "passlib[bcrypt]>=1.7",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=12.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "torch>=2.3",
]
backtest = [
    "vectorbt>=0.26",
    "numba>=0.59",
    "ta-lib>=0.4",
]
agent = [
    "agentscope>=0.1",
]
all = [
    "cryptoquant[dev,ml,backtest,agent]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
