<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11151c" />
    <meta name="description" content="CryptoQuant — 数字币量化研究平台：数据 · 因子 · 策略 · 回测 · 模拟 · AI" />
    <link rel="icon" href="/favicon.ico" />
    <title>CryptoQuant · 数字币量化研究</title>
    <script>
      // 首帧前应用主题，避免闪烁
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('cq:theme') || '{}')
          var mode = stored && stored.mode ? stored.mode : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
