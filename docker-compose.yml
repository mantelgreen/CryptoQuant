version: "3.9"

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: cq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptoquant_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cryptoquant_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./backend
    container_name: cq_gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    container_name: cq_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "arq", "app.job.arq_app.WorkerSettings"]

  scheduler:
    build:
      context: ./backend
    container_name: cq_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "app.job.scheduler"]

volumes:
  pgdata:
